<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Truklick self-test</title></head>
<body style="font-family: sans-serif; padding: 40px; background:#111; color:#eee;">
  <h1>Truklick engine self-test</h1>
  <p>An always-present element the engine can prove itself against — the same
     trusted-click check as the PoCs, but driven end-to-end through the engine
     (targeting → raw CDP click).</p>
  <button id="target"
          style="font-size: 24px; padding: 24px 48px; margin-top: 24px;
                 background:#5b5bd6; color:white; border:none; border-radius:12px;
                 cursor:pointer;">
    Self-Test Target
  </button>
  <pre id="log" style="margin-top:24px; font-size:16px; color:#7fd67f;"></pre>
  <script>
    window.__result = null;
    const btn = document.getElementById('target');
    const log = document.getElementById('log');
    btn.addEventListener('click', (e) => {
      window.__result = { received: true, isTrusted: e.isTrusted, at: Date.now() };
      log.textContent = 'CLICK RECEIVED  isTrusted=' + e.isTrusted;
      btn.style.background = e.isTrusted ? '#2ea043' : '#d29922';
      btn.textContent = e.isTrusted ? 'TRUSTED ✓' : 'UNTRUSTED ✗';
    });
  </script>
</body>
</html>
